<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try { const savedTheme = localStorage.getItem("portfolio-theme"); document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark"; } catch (error) { document.documentElement.dataset.theme = "dark"; }</script>
  <title>Dennis Carlos | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="contact-page">
  <div id="vanta-bg">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navtext1 navbar-brand" href="index.html">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown pages-dropdown">
              <button class="navtext1 nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Pages</button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="about.html">About Me</a></li>
                <li><a class="dropdown-item" href="certifications.html">Certifications</a></li>
                <li><a class="dropdown-item" href="techstack.html">Tech Stack</a></li>
                <li><a class="dropdown-item" href="projects.html">Projects</a></li>
                <li><a class="dropdown-item" href="training.html">Training and Awards</a></li>
                <li><a class="dropdown-item" href="contact.html">Contact</a></li>
              </ul>
            </li>
            <li class="nav-item theme-toggle-item">
              <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" aria-pressed="true"><span data-theme-icon aria-hidden="true">☾</span><span>Dark mode</span></button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="d-block mt-5 text-center">
      <h1 class="header1 mb-3">Connect With Me</h1>
      <aside class="contact-welcome" role="status" aria-label="Welcome message">
        <img src="img/cute.gif" width="64" height="64" alt="Animated bunny working at a laptop">
        <p class="p2">Have a project, idea, or opportunity in mind? I’d be glad to connect with you and explore how we can make it happen.</p>
        <button class="contact-welcome-close" type="button" aria-label="Dismiss welcome message">×</button>
      </aside>
      <div class="contact-container">
        <div class="d-flex flex-wrap justify-content-center align-items-center">
          <a href="https://github.com/kotkot31" target="_blank" rel="noopener noreferrer" class="text-decoration-none contact-link contact-github">
            <div class="contact-card d-flex flex-column align-items-center justify-content-center">
              <div class="logo-bg d-flex align-items-center justify-content-center mb-2">
                <img class="rounded-circle" src="img/ic_github.png" width="40" height="40" alt="GitHub">
              </div>
              <p class="p2 text-center">GitHub</p>
            </div>
          </a>
          <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="text-decoration-none contact-link contact-linkedin">
            <div class="contact-card d-flex flex-column align-items-center justify-content-center">
              <div class="logo-bg d-flex align-items-center justify-content-center mb-2">
                <img class="rounded-circle" src="https://cdn-icons-png.flaticon.com/512/174/174857.png" width="40" height="40" alt="LinkedIn">
              </div>
              <p class="p2 text-center">LinkedIn</p>
            </div>
          </a>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.cells.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.querySelector('.contact-welcome-close').addEventListener('click', () => {
      document.querySelector('.contact-welcome').remove();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</html>
