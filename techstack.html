  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Custom tech card tooltip logic
      const tooltip = document.createElement('div');
      tooltip.className = 'tech-tooltip';
      tooltip.id = 'tech-tooltip';
      tooltip.setAttribute('role', 'tooltip');
      document.body.appendChild(tooltip);
      let activeCard = null;
      function positionTooltip(card) {
        const rect = card.getBoundingClientRect();
        const navbar = document.querySelector('.navbar');
        const navbarBottom = navbar ? navbar.getBoundingClientRect().bottom : 0;
        const gap = 16;
        let top = rect.top - tooltip.offsetHeight - gap;

        // Place the description below the card whenever its usual position
        // would collide with the sticky navigation.
        if (top < navbarBottom + gap) {
          top = rect.bottom + gap;
        }

        const left = Math.max(8, Math.min(
          rect.left + rect.width / 2 - tooltip.offsetWidth / 2,
          window.innerWidth - tooltip.offsetWidth - 8
        ));
        tooltip.style.left = (left + window.scrollX) + 'px';
        tooltip.style.top = (top + window.scrollY) + 'px';
      }
      function showTooltip(card) {
        activeCard = card;
        tooltip.textContent = card.getAttribute('data-tooltip');
        card.setAttribute('aria-describedby', tooltip.id);
        positionTooltip(card);
        tooltip.style.opacity = 1;
        window.requestAnimationFrame(function() {
          if (activeCard === card) positionTooltip(card);
        });
      }
      function hideTooltip(card) {
        if (activeCard !== card || document.activeElement === card || card.matches(':hover')) return;
        tooltip.style.opacity = 0;
        activeCard = null;
      }
      document.querySelectorAll('.tech-card[data-tooltip]').forEach(card => {
        card.tabIndex = 0;
        card.addEventListener('mouseenter', () => showTooltip(card));
        card.addEventListener('focus', () => showTooltip(card));
        card.addEventListener('mousemove', () => positionTooltip(card));
        card.addEventListener('mouseleave', () => hideTooltip(card));
        card.addEventListener('blur', () => hideTooltip(card));
      });
      window.addEventListener('scroll', function() {
        if (activeCard) {
          positionTooltip(activeCard);
        }
      }, { passive: true });
    });
  </script>
