<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try { const savedTheme = localStorage.getItem("portfolio-theme"); document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark"; } catch (error) { document.documentElement.dataset.theme = "dark"; }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <title>Document</title>
</head>
<body>
  <div id="vanta-bg">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navtext1 navbar-brand" href="certifications.html">Go Back</a>
        <button class="theme-toggle ms-auto" type="button" data-theme-toggle aria-label="Switch to light mode" aria-pressed="true"><span data-theme-icon aria-hidden="true">☾</span><span>Dark mode</span></button>
      </div>
    </nav>
    <div class="pptcont d-flex justify-content-center align-items-center" style="min-height: 70vh;">
      <img src="img/powerpoint.jpg" class="img-fluid ppt-img" style="max-width: 900px; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 4px 24px rgba(0,0,0,0.13);">
    </div>
    <style>
      @media (max-width: 600px) {
        .pptcont {
          padding: 0 8px;
        }
        .ppt-img {
          max-width: 100% !important;
          border-radius: 10px !important;
        }
      }
    </style>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.cells.min.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
